<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balance">
<title>Balance Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f2f2f7; color: #1c1c1e; max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 17px; font-weight: 600; text-align: center; padding: 12px 0 16px; }
.card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.lbl { font-size: 12px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.sublbl { font-size: 11px; color: #b0b0b8; margin-bottom: 8px; }
.bal-row { display: flex; align-items: center; gap: 4px; }
.dollar { font-size: 32px; font-weight: 300; color: #8e8e93; }
.bal-row input { font-size: 36px; font-weight: 300; border: none; outline: none; background: transparent; color: #1c1c1e; width: 100%; }
.cur-bal { font-size: 28px; font-weight: 300; color: #1c1c1e; margin-top: 4px; }
.divider { border-top: 0.5px solid #f2f2f7; margin: 12px 0; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row input { flex: 1; font-size: 17px; border: 0.5px solid #e0e0e0; border-radius: 10px; padding: 8px 12px; outline: none; }
.btn-row button { border: none; border-radius: 10px; padding: 8px 16px; font-size: 15px; font-weight: 500; cursor: pointer; color: white; }
.btn-green { background: #34c759; }
.btn-red { background: #ff3b30; }
.owed-card { background: #fff2f2; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
.owed-card.paid { opacity: 0.4; }
.owed-info { flex: 1; }
.owed-title { font-size: 15px; color: #cc3333; font-weight: 500; }
.owed-card.paid .owed-title { text-decoration: line-through; color: #8e8e93; }
.owed-sub { font-size: 12px; color: #cc3333; opacity: 0.7; margin-top: 2px; }
.owed-amt { font-size: 15px; font-weight: 600; color: #cc3333; }
.bills-card { background: white; border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
.bills-hdr { font-size: 12px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 16px 8px; }
.bill-row { display: flex; align-items: center; padding: 12px 16px; border-top: 0.5px solid #f2f2f7; gap: 12px; transition: opacity 0.2s; }
.bill-row.paid { opacity: 0.35; }
.bill-name { font-size: 15px; color: #1c1c1e; }
.bill-row.paid .bill-name { text-decoration: line-through; color: #8e8e93; }
.bill-date { font-size: 12px; color: #8e8e93; margin-top: 2px; }
.bill-info { flex: 1; }
.bill-amt { font-size: 15px; font-weight: 500; color: #1c1c1e; min-width: 68px; text-align: right; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: #34c759; cursor: pointer; flex-shrink: 0; }
.bills-total { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-top: 0.5px solid #f2f2f7; background: #f9f9f9; }
.bills-total span:first-child { font-size: 13px; font-weight: 600; color: #1c1c1e; }
.bills-total span:last-child { font-size: 13px; font-weight: 600; color: #cc3333; }
.rem-lbl { font-size: 13px; color: #8e8e93; text-align: center; margin-bottom: 8px; }
.result-card { border-radius: 16px; padding: 20px; margin-bottom: 12px; text-align: center; }
.result-card.neutral { background: #f2f2f7; }
.result-card.positive { background: #e8f9ee; }
.result-card.negative { background: #fff0f0; }
.res-lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.neutral .res-lbl { color: #8e8e93; }
.positive .res-lbl { color: #1a7f3c; }
.negative .res-lbl { color: #cc3333; }
.res-num { font-size: 48px; font-weight: 300; letter-spacing: -1px; }
.neutral .res-num { color: #1c1c1e; }
.positive .res-num { color: #1a7f3c; }
.negative .res-num { color: #cc3333; }
.res-sub { font-size: 13px; margin-top: 6px; }
.neutral .res-sub { color: #8e8e93; }
.positive .res-sub { color: #1a7f3c; }
.negative .res-sub { color: #cc3333; }
.reset-btn { display: block; width: 100%; padding: 14px; background: white; border: none; border-radius: 12px; font-size: 15px; color: #8e8e93; cursor: pointer; }
.saved-note { font-size: 11px; color: #b0b0b8; text-align: center; padding: 6px 0 0; }
</style>
</head>
<body>

<h1>💰 Monthly Balance</h1>

<div class="card">
  <div class="lbl">starting balance this period</div>
  <div class="sublbl">enter once — use + income for new deposits</div>
  <div class="bal-row">
    <span class="dollar">$</span>
    <input type="number" id="starting" placeholder="0.00" step="0.01" inputmode="decimal" oninput="calc()" />
  </div>
  <div class="divider"></div>
  <div class="lbl">current balance</div>
  <div class="cur-bal" id="cur-bal">$0.00</div>
  <div class="btn-row">
    <input type="number" id="amt-input" placeholder="amount..." step="0.01" inputmode="decimal" />
    <button class="btn-green" onclick="addIncome()">+ income</button>
    <button class="btn-red" onclick="addSpend()">− spend</button>
  </div>
</div>



<div class="bills-card">
  <div class="bills-hdr">bills — check off when paid</div>
  <div id="bills-list"></div>
  <div class="bills-total"><span>Total fixed obligations</span><span id="bills-total"></span></div>
</div>

<div class="rem-lbl" id="rem-lbl"></div>

<div class="result-card neutral" id="result-card">
  <div class="res-lbl">real spendable money</div>
  <div class="res-num" id="res-num">—</div>
  <div class="res-sub" id="res-sub">enter your balance above</div>
</div>

<button class="reset-btn" onclick="resetAll()">reset for new month</button>
<div class="saved-note" id="saved-note"></div>

<script>
// ============================================================
// EDIT YOUR BILLS HERE. Order = order shown on screen.
// id must be unique and never change once set (keeps checkmarks).
// Sorted by day of month. Keep names/due text in the same style.
// To remove a bill, delete its line. To add one, copy a line.
// ============================================================
const BILLS = [
  { id: 'rent',        name: 'Rent (Zelle to Declan)',          due: 'due ~1st',  amt: 1025.00 },
  { id: 'reflect',     name: 'Wells Fargo Reflect (Autopay Min)', due: 'due ~2nd',  amt: 57.00 },
  { id: 'netflix',     name: 'Netflix (Privacy)',               due: 'due ~5th',  amt: 8.99 },
  { id: 'bofa',        name: 'Bank of America (Min)',           due: 'due ~5th',  amt: 65.00 },
  { id: 'nwmutual',    name: 'Northwestern Mutual',             due: 'due ~7th',  amt: 156.30 },
  { id: 'quicksilver', name: 'Capital One Quicksilver (Autopay Min)', due: 'due ~13th', amt: 110.00 },
  { id: 'aaa',         name: 'AAA Card (Autopay Min)',          due: 'due ~13th', amt: 30.00 },
  { id: 'carins',      name: 'State Farm Car Insurance (Privacy)', due: 'due ~16th', amt: 237.02 },
  { id: 'applemusic',  name: 'Apple Music (Privacy)',           due: 'due ~19th', amt: 11.99 },
  { id: 'icloud',      name: 'iCloud (Privacy)',                due: 'due ~25th', amt: 2.99 },
  { id: 'tmobile',     name: 'T-Mobile (Privacy)',              due: 'due ~25th', amt: 71.63 }
];

const KEY = 'sonny_tracker';
const $ = id => document.getElementById(id);

function fmt(n) {
  return Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function render() {
  $('bills-list').innerHTML = BILLS.map(b =>
    '<div class="bill-row" id="row-' + b.id + '"><div class="bill-info"><div class="bill-name">' + b.name +
    '</div><div class="bill-date">' + b.due + '</div></div><span class="bill-amt">$' + fmt(b.amt) +
    '</span><input type="checkbox" id="chk-' + b.id + '" onchange="calc()" /></div>'
  ).join('');
  $('bills-total').textContent = '$' + fmt(BILLS.reduce((t,b) => t + b.amt, 0));
}

function isPaid(b) { return $('chk-' + b.id).checked; }

function save() {
  const paid = {};
  BILLS.forEach(b => { paid[b.id] = isPaid(b); });
  localStorage.setItem(KEY, JSON.stringify({ starting: $('starting').value, paid: paid }));
  $('saved-note').textContent = 'saved ' + new Date().toLocaleTimeString();
}

function load() {
  try {
    const state = JSON.parse(localStorage.getItem(KEY));
    if (!state) return;
    $('starting').value = state.starting || '';
    const paid = state.paid || {};
    BILLS.forEach(b => { $('chk-' + b.id).checked = !!paid[b.id]; });
  } catch(e) {}
}

function calc() {
  const starting = parseFloat($('starting').value) || 0;

  let paidTotal = 0, unpaid = 0, paidCount = 0;
  BILLS.forEach(b => {
    if (isPaid(b)) { paidTotal += b.amt; paidCount++; } else { unpaid += b.amt; }
  });

  const current = starting - paidTotal;
  $('cur-bal').textContent = (current < 0 ? '-$' : '$') + fmt(current);

  const spendable = current - unpaid;

  BILLS.forEach(b => {
    $('row-' + b.id).classList.toggle('paid', isPaid(b));
  });

  const card = $('result-card');
  $('res-num').textContent = (spendable < 0 ? '-$' : '$') + fmt(spendable);
  card.className = 'result-card ' + (starting === 0 ? 'neutral' : spendable >= 0 ? 'positive' : 'negative');

  $('rem-lbl').textContent = starting > 0 ? '$' + fmt(unpaid) + ' in obligations still coming' : '';
  $('res-sub').textContent = starting === 0 ? 'enter your balance above'
    : spendable >= 0 ? paidCount + ' of ' + BILLS.length + ' bills cleared'
    : 'you need $' + fmt(Math.abs(spendable)) + ' more income';

  save();
}

function addIncome() {
  const amt = parseFloat($('amt-input').value) || 0;
  if (amt <= 0) return;
  const cur = parseFloat($('starting').value) || 0;
  $('starting').value = (cur + amt).toFixed(2);
  $('amt-input').value = '';
  calc();
}

function addSpend() {
  const amt = parseFloat($('amt-input').value) || 0;
  if (amt <= 0) return;
  const cur = parseFloat($('starting').value) || 0;
  $('starting').value = (cur - amt).toFixed(2);
  $('amt-input').value = '';
  calc();
}

function resetAll() {
  if (!confirm('Reset for new month? This will clear everything.')) return;
  localStorage.removeItem(KEY);
  $('starting').value = '';
  BILLS.forEach(b => { $('chk-' + b.id).checked = false; });
  $('amt-input').value = '';
  $('saved-note').textContent = '';
  calc();
}

render();
load();
calc();
</script>
</body>
</html>
